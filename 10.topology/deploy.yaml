apiVersion: apps/v1
kind: Deployment
metadata:
  name: skala-myfirst-api-server
  namespace: class-0
spec:
  replicas: 2
  selector:
    matchLabels:
      app: skala-myfirst-api-server
  template:
    metadata:
      annotations:
        prometheus.io/scrape: 'true'
        prometheus.io/port: '8080'
        prometheus.io/path: '/prometheus'
        update: f9952e34
      labels:
        app: skala-myfirst-api-server
    spec:
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: skala.io/cloud
          whenUnsatisfiable: DoNotSchedule
          labelSelector:
            matchLabels:
              app: skala-myfirst-api-server

      containers:
        - name: webserver
          image: skala-registry.skala-ai.com/skala-webserver:1.0
          imagePullPolicy: Always
          env:
            - name: USER_NAME
              value: skala

