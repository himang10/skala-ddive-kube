apiVersion: v1
kind: Pod
metadata:
  name: curl-pod
  namespace: skala-practice
  labels:
    app: curl-pod
spec:
  containers:
    - name: curl
      image: curlimages/curl:8.12.1
      command:
        - /bin/sh
        - -c
        - |
          while true; do
            sleep 3600
          done
