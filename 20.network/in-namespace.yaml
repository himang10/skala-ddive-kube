apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: in-ns-netpolicy
  namespace: skala-practice
spec:
  podSelector:
    matchLabels:
      app: sk199-myfirst-api-server
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: curl-pod-exception
      ports:
        - protocol: TCP
          port: 8080
