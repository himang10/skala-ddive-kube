apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    nginx.ingress.kubernetes.io/priority: "1000"
  name: cloud-cm-tls-ingress
  namespace: class-cloud
spec:
  ingressClassName: nginx
  rules:
  - host: cloud.skala-edu.skala-ai.com
    http:
      paths:
      - backend:
          service:
            name: sk199-myfirst-api-server
            port:
              number: 8080
        path: /api
        pathType: Prefix
      - backend:
          service:
            name: sk199-myfirst-api-server
            port:
              number: 8080
        path: /actuator
        pathType: Prefix
      - backend:
          service:
            name: sk199-myfirst-api-server
            port:
              number: 8080
        path: /swagger
        pathType: Prefix
      - backend:
          service:
            name: sk199-myfirst-api-server
            port:
              number: 8080
        path: /
        pathType: Prefix
  tls:
  - hosts:
    - cloud.skala-edu.skala-ai.com
    secretName: cloud-cm-auto-tls-secret
