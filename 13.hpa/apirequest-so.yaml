apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: skala-api-so
  namespace: class-0
spec:
  scaleTargetRef:
    kind: Deployment
    name: skala-myfirst-api-server
  pollingInterval: 5              
  cooldownPeriod: 10              
  minReplicaCount: 1
  maxReplicaCount: 5
  advanced:
    horizontalPodAutoscalerConfig:
      behavior:
        scaleUp:
          stabilizationWindowSeconds: 0
          policies:
          - type: Percent
            value: 100
            periodSeconds: 5
        scaleDown:
          stabilizationWindowSeconds: 0
          policies:
          - type: Percent
            value: 100
            periodSeconds: 5

  triggers:
  - type: prometheus
    metadata:
      serverAddress: http://prometheus-server.remote-rde:80/prometheus  # 실제 Prometheus 주소로 변경
      metricName: http_requests_per_second
      query: >
        avg(rate(http_server_requests_seconds_count{namespace="class-0", pod=~"skala-myfirst-api-server.*"}[1m]))
      threshold: "30"  
