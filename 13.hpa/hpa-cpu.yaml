apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: skala-myfirst-api-server-hpa-utilization
  namespace: class-0
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: skala-myfirst-api-server
  minReplicas: 1
  maxReplicas: 5
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 50
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 0
      policies:
        - type: Percent
          value: 100
          periodSeconds: 5
    scaleDown:
      policies:
        - type: Percent
          value: 100
          periodSeconds: 5
      stabilizationWindowSeconds: 0
      selectPolicy: Min

