apiVersion: apps/v1
kind: Deployment
metadata:
  name: skala-myfirst-api-server
  namespace: class-0
  labels:
    app: skala-myfirst-api-server
spec:
  replicas: 1
  selector:
    matchLabels:
      app: skala-myfirst-api-server
  template:
    metadata:
      annotations:
        prometheus.io/scrape: 'true'
        prometheus.io/port: '8080'
        prometheus.io/path: '/actuator/prometheus'
        update: be7e31aa
      labels:
        app: skala-myfirst-api-server
    spec:
      containers:
      # -----------------------------------
      # Main Container
      # -----------------------------------
      - name: myfirst-api-server
        image: skala-registry.skala-ai.com/class-0/skala-webserver:1.0
        imagePullPolicy: Always
        env:
        - name: USER_NAME
          value: skala
        - name: NAMESPACE
          value: class-0
        - name: SPRING_PROFILES_ACTIVE  
          value: "local"  

      # -----------------------------------
      # Sidecar Container
      # -----------------------------------
      - name: nginx-sidecar
        image: nginx:1.27-alpine
        command: ["/bin/sh", "-c"]
        args:
          - apk add --no-cache jq && exec nginx -g 'daemon off;'

        ports:
        - containerPort: 80

        volumeMounts:
        - name: nginx-config
          mountPath: /etc/nginx/conf.d/default.conf
          subPath: default.conf


      volumes:
      - name: nginx-config
        configMap:
          name: skala-nginx-sidecar-config