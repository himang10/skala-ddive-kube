apiVersion: apps/v1
kind: Deployment
metadata:
  name: skala-myfirst-api-server
  namespace: class-0
  annotations:
    prometheus.io/scrape: 'true'
    prometheus.io/port: '8081'
    prometheus.io/path: '/actuator/prometheus'
    update: 7a4d145eaf266c9c6f556cce11c1c6f0
  labels:
    app: skala-myfirst-api-server
spec:
  replicas: 1
  selector:
    matchLabels:
      app: skala-myfirst-api-server
  template:
    metadata:
      annotations:
        prometheus.io/scrape: 'true'
        prometheus.io/port: '8081'
        prometheus.io/path: '/actuator/prometheus'
      labels:
        app: skala-myfirst-api-server
    spec:
      serviceAccountName: default
      containers:
      - name: webserver
        image: skala-registry.skala-ai.com/skala-webserver:1.0
        imagePullPolicy: Always
        volumeMounts:
        - name: secret-volume
          mountPath: /etc/secret-config
      volumes:
      - name: secret-volume
        secret:
          secretName: skala-dev-file-secret

