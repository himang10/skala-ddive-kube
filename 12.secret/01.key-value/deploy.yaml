apiVersion: apps/v1
kind: Deployment
metadata:
  name: skala-myfirst-api-server
  namespace: class-0
  annotations:
    prometheus.io/scrape: 'true'
    prometheus.io/port: '8080'
    prometheus.io/path: '/actuator/prometheus'
    update: 7a4d145eaf266c9c6f556cce11c1c6f0
  labels:
    app: skala-myfirst-api-server
spec:
  replicas: 1
  selector:
    matchLabels:
      app: skala-myfirst-api-server
  template:
    metadata:
      labels:
        app: skala-myfirst-api-server
    spec:
      containers:
      - name: webserver
        image: skala-registry.skala-us.com/class-0/skala-webserver:1.0
        imagePullPolicy: Always
        env:
        - name: USER_NAME
          value: skala

        - name: DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: skala-db-secret
              key: database.url
        - name: DATABASE_USER
          valueFrom:
            secretKeyRef:
              name: skala-db-secret
              key: database.user
        - name: DATABASE_PASSWORD
          valueFrom:
            secretKeyRef:
              name: skala-db-secret
              key: database.password

