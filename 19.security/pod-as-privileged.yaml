apiVersion: v1
kind: Pod
metadata:
  name: skala-pod-as-privileged
  namespace: class-0
spec:
  hostNetwork: true
  containers:
    - name: main
      image: alpine
      command:
        - /bin/sh
        - -c
        - |
          apk add iptables
          sleep infinity
      securityContext:
        privileged: true
