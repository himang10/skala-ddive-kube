apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: sk199-myfirst-api-server-hpa-average
  namespace: skala-practice
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: sk199-myfirst-api-server
  minReplicas: 1
  maxReplicas: 10
  metrics:
  - type: Resource
    resource:
      name: memory
      target:
        type: AverageValue
        averageValue: 128Mi
