apiVersion: apps/v1
kind: Deployment
metadata:
  name: skala-myfirst-api-server
  namespace: class-0
spec:
  replicas: 1
  selector:
    matchLabels:
      app: skala-myfirst-api-server
  template:
    metadata:
      annotations:
        update: 09b4f249
      labels:
        app: skala-myfirst-api-server
    spec:
      terminationGracePeriodSeconds: 20  # default 30s
      containers:
      - name: webserver
        image: skala-registry.skala-ai.com/skala-webserver:1.0
        imagePullPolicy: Always
        env:
        - name: USER_NAME
          value: skala
        ports:
        - containerPort: 8080
        lifecycle:
          postStart:
            exec:
              command: ["/bin/sh", "-c", "echo '[postStart] container started: skala-myfirst-api-server' > /proc/1/fd/1"]
          preStop:
            exec:
              command: ["/bin/sh", "-c", "echo '[preStop] container stopping: skala-myfirst-api-server' > /proc/1/fd/1 && sleep 10"]

