apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: skala-ingress
  namespace: class-0
spec:
  ingressClassName: nginx
  rules:
  - host: skala-ingress.class-0.skala-us.com
    http:
      paths:
      - backend:
          service:
            name: skala-myfirst-api-server
            port:
              number: 8080
        path: /api
        pathType: Prefix
      - backend:
          service:
            name: skala-myfirst-api-server
            port:
              number: 8080
        path: /actuator
        pathType: Prefix
      - backend:
          service:
            name: skala-myfirst-api-server
            port:
              number: 8080
        path: /swagger
        pathType: Prefix
      - backend:
          service:
            name: skala-myfirst-api-server
            port:
              number: 8080
        path: /
        pathType: Prefix
