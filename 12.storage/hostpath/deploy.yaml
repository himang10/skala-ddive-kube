apiVersion: apps/v1
kind: Deployment
metadata:
  name: skala-myfirst-api-server
  namespace: class-0
spec:
  replicas: 1
  selector:
    matchLabels:
      app: skala-myfirst-api-server
  template:
    metadata:
      annotations:
        update: 09b4f249
      labels:
        app: skala-myfirst-api-server
    spec:
      serviceAccountName: default
      containers:
      - name: storage-test
        image: busybox
        imagePullPolicy: IfNotPresent
        command: ["/bin/sh", "-c"]
        args:
          - echo "Hello from busybox" > /data/hello.txt && sleep infinity
        volumeMounts:
        - name: hostpath-volume
          mountPath: /data
      volumes:
      - name: hostpath-volume
        hostPath:
          path: /tmp/hostpath-skala-myfirst-api-server
          type: DirectoryOrCreate
