apiVersion: apps/v1
kind: Deployment
metadata:
  name: skala-myfirst-api-server
  namespace: class-0
spec:
  replicas: 1
  selector:
    matchLabels:
      app: skala-myfirst-api-server
  template:
    metadata:
      annotations:
        update: 09b4f249
      labels:
        app: skala-myfirst-api-server
    spec:
      serviceAccountName: default
      containers:
      - name: volume-test1
        image: busybox
        imagePullPolicy: IfNotPresent
        command: ["/bin/sh", "-c"]
        args:
          - echo "Hello from busybox" > /data1/hello1.txt && sleep infinity
        volumeMounts:
        - name: emptydir-volume
          mountPath: /data1
      - name: volume-test2
        image: busybox
        imagePullPolicy: IfNotPresent
        command: ["/bin/sh", "-c"]
        args:
          - echo "Hello from busybox" > /data2/hello2.txt && sleep infinity
        volumeMounts:
        - name: emptydir-volume
          mountPath: /data2
      volumes:
      - name: emptydir-volume
        emptyDir: {}

