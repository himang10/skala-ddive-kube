apiVersion: v1
kind: ServiceAccount
metadata:
  name: class-0-skala-sa
  namespace: class-0
---
apiVersion: v1
kind: Secret
metadata:
  name: class-0-skala-sa-token
  namespace: class-0
  annotations:
    kubernetes.io/service-account.name: class-0-skala-sa
type: kubernetes.io/service-account-token
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: admin-role-binding
  namespace: class-0
subjects:
- kind: ServiceAccount
  name: class-0-skala-sa
  namespace: class-0
roleRef:
  kind: ClusterRole
  name: cluster-admin
  apiGroup: rbac.authorization.k8s.io
