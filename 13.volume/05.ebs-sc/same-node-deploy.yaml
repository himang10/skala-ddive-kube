apiVersion: apps/v1
kind: Deployment
metadata:
  name: skala-volume-test
  namespace: class-0
spec:
  replicas: 2
  selector:
    matchLabels:
      app: skala-volume-test
  template:
    metadata:
      labels:
        app: skala-volume-test
    spec:
      affinity:
        podAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
          - labelSelector:
              matchLabels:
                app: skala-volume-test
            topologyKey: kubernetes.io/hostname
      terminationGracePeriodSeconds: 0
      containers:
      - name: test
        image: busybox
        imagePullPolicy: IfNotPresent
        command: ["/bin/sh", "-c"]
        args:
          - echo "Hello from busybox" > /data/hello.txt && sleep infinity
        volumeMounts:
        - name: ebs-volume
          mountPath: /data
      volumes:
      - name: ebs-volume
        persistentVolumeClaim:
          claimName: skala-ebs-pvc