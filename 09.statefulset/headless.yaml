apiVersion: v1
kind: Service
metadata:
  name: skala-myfirst-api-server-headless
  namespace: class-0
spec:
  clusterIP: None
  selector:
    app: skala-myfirst-api-server
  ports:
    - name: http
      protocol: TCP
      port: 8080
      targetPort: 8080
    - name: mgmt
      protocol: TCP
      port: 8081
      targetPort: 8081

