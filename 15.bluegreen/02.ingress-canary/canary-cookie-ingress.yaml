apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  annotations:
    nginx.ingress.kubernetes.io/canary: "true"
    nginx.ingress.kubernetes.io/canary-by-cookie: "canary-session"
  name: skala-cert-canary-ingress
  namespace: class-0
  labels:
    app: skala-cert-canary-ingress
spec:
  ingressClassName: nginx
  rules:
  - host: skala-cert-ingress.class-0.skala-us.com
    http:
      paths:
      - backend:
          service:
            name: skala-green
            port:
              number: 8080
        path: /
        pathType: Prefix
  tls:
  - hosts:
    - 'skala-cert-ingress.class-0.skala-us.com'
    secretName: wildcard-class-0-skala-us-com-tls

