apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
  name: skala-cm-tls-ingress
  namespace: class-0
spec:
  ingressClassName: public-nginx
  rules:
  - host: skala-tls.skala25a.project.skala-ai.com
    http:
      paths:
      - backend:
          service:
            name: skala-blue
            port:
              number: 8080
        path: /
        pathType: Prefix
  tls:
  - hosts:
    - skala-tls.skala25a.project.skala-ai.com
    secretName: skala-cm-auto-tls-secret
