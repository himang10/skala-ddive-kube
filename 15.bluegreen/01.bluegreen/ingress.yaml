apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
#  annotations:
#    cert-manager.io/cluster-issuer: letsencrypt-prod
  name: skala-cert-ingress
  namespace: class-0
  labels:
    app: skala-cert-ingress
spec:
  ingressClassName: nginx
  rules:
  - host: skala-cert-ingress.class-0.skala-us.com
    http:
      paths:
      - backend:
          service:
            name: skala-myfirst-api-server
            port:
              number: 8080
        path: /
        pathType: Prefix
  tls:
  - hosts:
    - 'skala-cert-ingress.class-0.skala-us.com'
    secretName: wildcard-class-0-skala-us-com-tls
