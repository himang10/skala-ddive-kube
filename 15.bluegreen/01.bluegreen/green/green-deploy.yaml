apiVersion: apps/v1
kind: Deployment
metadata:
  name: skala-green
  namespace: class-0
spec:
  replicas: 1
  selector:
    matchLabels:
      app: skala-myfirst-api-server
      version: "2.0"
  template:
    metadata:
      annotations:
        prometheus.io/scrape: 'true'
        prometheus.io/port: '8080'
        prometheus.io/path: '/actuator/prometheus'
        update: 5d702c48
      labels:
        app: skala-myfirst-api-server
        version: "2.0"
    spec:
      containers:
      - name: webserver
        image: skala-registry.skala-us.com/class-0/skala-webserver:2.0
        imagePullPolicy: Always
        env:
        - name: USER_NAME
          value: skala
        - name: NAMESPACE
          value: class-0
