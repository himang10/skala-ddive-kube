apiVersion: v1
kind: Service
metadata:
  name: skala-green
  namespace: class-0
spec:
  selector:
    app: skala-myfirst-api-server
    version: 2.0.0-NEW
  ports:
    - name: http
      protocol: TCP
      port: 8080
      targetPort: 8080
    - name: mgmt
      protocol: TCP
      port: 8081
      targetPort: 8081
  type: ClusterIP


