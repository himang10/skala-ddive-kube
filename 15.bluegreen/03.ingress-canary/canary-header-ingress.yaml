apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    nginx.ingress.kubernetes.io/canary: "true"
    nginx.ingress.kubernetes.io/canary-by-header: "x-region"
    nginx.ingress.kubernetes.io/canary-by-header-value: "ap-suwon"
  name: skala-cm-tls-canary-ingress
  namespace: class-0
spec:
  ingressClassName: public-nginx
  rules:
  - host: skala-ingress.skala25a.project.skala-ai.com
    http:
      paths:
      - backend:
          service:
            name: skala-green
            port:
              number: 8080
        path: /
        pathType: Prefix
  tls:
  - hosts:
    - skala-ingress.skala25a.project.skala-ai.com
    secretName: skala-cm-auto-tls-secret
